---
- name: Deploy Flask Vision Board Application
  hosts: all                     # 1. שונה מ-webservers ל-all (או localhost)
  become: false                  # 2. שונה מ-true ל-false (לא צריך sudo ב-GitHub Actions)

  vars:
    docker_hub_user: "zehavab"
    image_name: "flask-vision-board"
    container_name: "flask_vision_app"

  tasks:
    - name: Remove existing container if it exists
      community.docker.docker_container: # 3. שימוש בשם המודול המלא
        name: "{{ container_name }}"
        state: absent
      ignore_errors: true

    - name: Pull latest image from DockerHub
      community.docker.docker_image:     # 3. שימוש בשם המודול המלא
        name: "{{ docker_hub_user }}/{{ image_name }}:latest"
        source: pull
        force_source: true

    - name: Run the new Flask container
      community.docker.docker_container: # 3. שימוש בשם המודול המלא
        name: "{{ container_name }}"
        image: "{{ docker_hub_user }}/{{ image_name }}:latest"
        state: started
        restart_policy: always
        ports:
          - "5000:5000"
